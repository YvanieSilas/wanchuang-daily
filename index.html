<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万创日报</title>
<style>
:root {
  --paper: #F5EFE4; --sheet: #FBF7EE; --sand: #E8E6DC;
  --ink: #2A2622; --ink-light: #4A433C; --ink-muted: #6B6158;
  --border: #D8CFBE; --accent: #537D96; --accent-deep: #1B365D;
  --green: #4A6B4A; --danger: #8B2C1F; --ochre: #9D5F4D; --warm-gray: #8F867B;
  --radius: 3px;
  --font-serif: 'Georgia','Noto Serif SC','Songti SC',serif;
  --font-sans: -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
}

:root.theme-dark {
  --paper: #0f1419; --sheet: #161b22; --sand: #1c2128;
  --ink: #c9d1d9; --ink-light: #8b949e; --ink-muted: #6e7681;
  --border: #30363d; --accent: #58a6ff; --accent-deep: #79c0ff;
  --green: #3fb950; --danger: #f85149; --ochre: #d29922; --warm-gray: #6e7681;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); padding:2rem 1.5rem 4rem; }
.wrap { max-width:1100px; margin:0 auto; }

.masthead { text-align:center; padding-bottom:1.5rem; margin-bottom:1.5rem; border-bottom:1px solid var(--border); }
.masthead .rule-top { border:none; border-top:2px solid var(--ink); width:60px; margin:0 auto 1rem; }
.masthead h1 { font-family:var(--font-serif); font-size:2.2rem; font-weight:500; letter-spacing:.06em; }
.masthead .dateline { font-family:var(--font-serif); font-size:.82rem; color:var(--ink-muted); margin-top:.4rem; letter-spacing:.04em; }
.masthead .rule-bottom { border:none; border-top:.5px solid var(--border); width:100%; margin:.8rem auto 0; }

.date-nav { display:flex; align-items:center; justify-content:center; gap:1.2rem; margin-bottom:1.5rem; font-family:var(--font-serif); }
.date-nav button { background:none; border:.5px solid var(--border); border-radius:var(--radius); color:var(--ink-muted); font-family:var(--font-serif); font-size:.8rem; padding:4px 12px; cursor:pointer; }
.date-nav button:hover { color:var(--accent); border-color:var(--accent); }
.date-nav .cur { font-size:.9rem; font-weight:500; }

.section-title { font-family:var(--font-serif); font-size:.95rem; font-weight:500; border-left:2px solid var(--accent); padding-left:10px; border-radius:0; margin-bottom:.8rem; }

/* overview */
.ov-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:rgba(216,207,190,0.5); border:.5px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:1.5rem; }
.ov-cell { background:var(--sheet); padding:.9rem .7rem; text-align:center; }
.ov-cell .ol { font-size:.65rem; color:var(--ink-muted); letter-spacing:.04em; }
.ov-cell .ov { font-family:var(--font-serif); font-size:1.4rem; font-weight:500; color:var(--accent-deep); }
.ov-cell .os { font-size:.65rem; color:var(--ink-muted); margin-top:.1rem; }

/* metrics row */
.mt-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:rgba(216,207,190,0.5); border:.5px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:1.8rem; }
.mt-cell { background:var(--sheet); padding:.9rem .7rem; text-align:center; }
.mt-cell .ml { font-size:.65rem; color:var(--ink-muted); letter-spacing:.04em; }
.mt-cell .mv { font-family:var(--font-serif); font-size:1.4rem; font-weight:500; color:var(--accent); }
.mt-cell.alert .mv { color:var(--danger); }

/* dept accordion */
.dept-list { display:flex; flex-direction:column; gap:1px; background:rgba(216,207,190,0.5); border:.5px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:1.8rem; }
.dept-hdr { display:grid; grid-template-columns:1.6fr 1fr 1fr .8fr 1fr .9fr; padding:8px 12px; background:var(--sand); font-size:.7rem; font-weight:500; color:var(--ink-light); letter-spacing:.03em; }
.dept-item { background:var(--sheet); cursor:pointer; user-select:none; }
.dept-item:hover { background:#F2ECDE; }
.theme-dark .dept-item:hover { background:#1c2533; }
.dept-item.expanded { background:rgba(83,125,150,.035); }
.theme-dark .dept-item.expanded { background:#161f2a; }
.theme-dark .m-row { background:transparent; border-top-color:#21262d; }
.dept-main { display:grid; grid-template-columns:1.6fr 1fr 1fr .8fr 1fr .9fr; padding:10px 12px; align-items:center; font-size:.82rem; }
.dept-name { display:flex; align-items:center; gap:6px; }
.dept-name .chevron { font-size:.55rem; color:var(--ink-muted); transition:transform .25s; width:12px; text-align:center; }
.dept-item.expanded .chevron { transform:rotate(90deg); }
.dept-detail { max-height:0; overflow:hidden; transition:max-height .35s; }
.theme-dark .dept-detail { background:#111820; }
.dept-item.expanded .dept-detail { max-height:800px; }
.m-row { display:grid; grid-template-columns:1.6fr 1fr 1fr .8fr 1fr .9fr; padding:7px 12px; font-size:.78rem; border-top:.5px solid rgba(0,0,0,.04); background:rgba(83,125,150,.02); align-items:center; }
.m-name { padding-left:24px; color:var(--ink-light); }
.m-rank { font-size:.72rem; color:var(--ink-muted); }

.badge { display:inline-flex; padding:1px 7px; font-size:.68rem; font-weight:500; border-radius:var(--radius); white-space:nowrap; }
.badge-ok { background:rgba(74,107,74,.1); color:var(--green); }
.badge-warn { background:rgba(157,95,77,.1); color:var(--ochre); }
.badge-danger { background:rgba(139,44,31,.1); color:var(--danger); }
.badge-neutral { background:rgba(143,134,123,.1); color:var(--warm-gray); }
.badge-info { background:#E4ECF5; color:var(--accent-deep); }

.wechat-new-strip { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.8rem; font-size:.82rem; }
.wechat-new-strip .wn-tag { background:var(--sheet); border:.5px solid rgba(157,95,77,.15); border-radius:var(--radius); padding:4px 10px; }

.snap-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:2rem; }
.snap-card { background:var(--sheet); border:.5px solid var(--border); border-radius:var(--radius); padding:.8rem 1rem; }
.snap-card .sl { font-size:.68rem; color:var(--ink-muted); margin-bottom:.2rem; }
.snap-card .sv { font-size:.88rem; font-weight:500; }
.snap-card.g .sv { color:var(--green); }
.snap-card.r .sv { color:var(--danger); }

.banner { background:var(--sheet); border:.5px solid var(--border); border-radius:var(--radius); padding:1rem 1.2rem; margin-bottom:1.8rem; }
.banner .b-top { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; margin-bottom:.8rem; }
.banner .b-metric { min-width:80px; }
.banner .b-metric .bl { font-size:.65rem; color:var(--ink-muted); letter-spacing:.04em; }
.banner .b-metric .bv { font-family:var(--font-serif); font-size:1.5rem; font-weight:500; color:var(--accent); }
.banner .b-metric.alert .bv { color:var(--danger); }
.banner .b-divider { width:.5px; height:32px; background:var(--border); margin:0 4px; }
.banner .b-top3 { font-size:.75rem; color:var(--ink-light); min-width:160px; }
.banner .b-top3 span { color:var(--accent); font-weight:500; }
.banner .b-trend { display:flex; align-items:flex-end; gap:6px; height:44px; }
.banner .b-trend .bt-bar { flex:1; background:var(--border); border-radius:1px 1px 0 0; min-width:12px; }
.banner .b-trend .bt-bar.today { background:var(--accent); }
.banner .b-trend-labels { display:flex; gap:6px; font-size:.58rem; color:var(--ink-muted); margin-top:3px; }
.banner .b-trend-labels span { flex:1; text-align:center; min-width:12px; }
.bt-bar-wrap { flex:1; display:flex; gap:2px; align-items:flex-end; min-width:28px; position:relative; cursor:default; }
.bt-bar-wrap:hover .bt-tip { display:block; }
.bt-tip { display:none; position:absolute; bottom:110%; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:.65rem; padding:3px 7px; border-radius:3px; white-space:nowrap; z-index:10; pointer-events:none; }
@media(max-width:700px) { .banner .b-divider { display:none; } }

/* Sidebar */







@media(max-width:900px) {  }

.footer { text-align:center; padding-top:1.2rem; border-top:.5px solid var(--border); font-family:var(--font-serif); font-size:.72rem; color:var(--ink-muted); letter-spacing:.03em; }

@media(max-width:700px) {
  body { padding:1rem .6rem 2rem; }
  .masthead h1 { font-size:1.6rem; }
  .ov-grid { grid-template-columns:repeat(2,1fr); }
  .mt-grid { grid-template-columns:repeat(3,1fr); }
  .mt-cell:last-child { grid-column:span 3; }
  .dept-hdr,.dept-main,.m-row { grid-template-columns:1.3fr .8fr .8fr .6fr 1fr .8fr; font-size:.73rem; }
  .snap-grid { grid-template-columns:1fr; }
}
</style>

function fmtVal(v,s) { return v!=null ? v+(s||'') : '—'; }
function sBadge(s) {
  var m = {normal:['badge-ok','正常'],danger:['badge-danger','低活跃'],warn:['badge-warn','待观察'],nodata:['badge-neutral','暂无数据'],admin:['badge-neutral','招聘行政']};

}
function tBadge(tag,type) {
  var m = {info:'badge-info',warn:'badge-warn',danger:'badge-danger'};
  return '<span class="badge '+(m[type]||'badge-info')+'">'+tag+'</span>';
}

document.getElementById('btnPrev').onclick = function(){ if(cur>0){cur--;render(DATES[cur]);} };

document.onkeydown = function(e){

  if(e.key==='ArrowRight'&&cur<DATES.length-1){cur++;render(DATES[cur]);}
};
