<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵伟伟 · 个人档案</title>
<style>
:root {
  --paper: #F5EFE4; --sheet: #FBF7EE; --sand: #E8E6DC;
  --ink: #2A2622; --ink-light: #4A433C; --ink-muted: #6B6158; --ink-faint: #C9C1B2;
  --border: #D8CFBE; --accent: #537D96; --accent-deep: #1B365D; --accent-light: rgba(83,125,150,.08);
  --green: #4A6B4A; --danger: #8B2C1F; --ochre: #9D5F4D; --warm-gray: #8F867B;
  --radius: 3px;
  --font-serif: 'Georgia','Noto Serif SC','Songti SC',serif;
}
:root.theme-dark {
  --paper: #0f1419; --sheet: #161b22; --sand: #1c2128;
  --ink: #c9d1d9; --ink-light: #8b949e; --ink-muted: #6e7681; --ink-faint: #484f58;
  --border: #30363d; --accent: #58a6ff; --accent-deep: #79c0ff; --accent-light: rgba(88,166,255,.1);
  --green: #3fb950; --danger: #f85149; --ochre: #d29922; --warm-gray: #6e7681;
}
:root.theme-green {
  --paper: #F5F1E8; --sheet: #FBF9F2; --sand: #EAE5D9;
  --ink: #2A2A24; --ink-light: #4A4A42; --ink-muted: #6E6E64; --ink-faint: #C6C4B8;
  --border: #DAD5C8; --accent: #4F7A4F; --accent-deep: #345534; --accent-light: rgba(79,122,79,.1);
  --green: #4F7A4F; --danger: #8B2C1F; --ochre: #9D6B4D; --warm-gray: #8A8578;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--paper); color:var(--ink); font-family:-apple-system,'PingFang SC',sans-serif; }
.page { max-width:880px; margin:0 auto; padding:1.6rem 1.2rem 3rem; }
a { color:var(--accent); text-decoration:none; }
a:hover { color:var(--accent-deep); }
.topbar { display:flex; align-items:baseline; gap:10px; margin-bottom:.5rem; flex-wrap:wrap; }
.back { font-size:.8rem; }
.p-title { font-family:var(--font-serif); font-size:1.5rem; font-weight:500; }
.p-dept { font-size:.75rem; color:var(--ink-muted); }
.rule { border:none; border-top:.5px solid var(--border); margin:.7rem 0 1.2rem; }
.kpi { display:flex; flex-wrap:wrap; gap:10px 22px; margin-bottom:1.4rem; }
.kpi .k { min-width:70px; }
.kpi .kl { font-size:.62rem; color:var(--ink-muted); }
.kpi .kv { font-family:var(--font-serif); font-size:1.3rem; font-weight:600; color:var(--accent-deep); }
.kpi .kv.danger { color:var(--danger); }
.badge { display:inline-block; padding:2px 10px; border-radius:9px; font-size:.68rem; }
.badge-great { background:rgba(83,125,150,.12); color:var(--accent); }
.badge-ok { background:rgba(74,107,74,.12); color:var(--green); }
.badge-warn { background:rgba(157,95,77,.12); color:var(--ochre); }
.badge-danger { background:rgba(139,44,31,.12); color:var(--danger); }
.sec-title { font-family:var(--font-serif); font-size:.92rem; font-weight:500; border-left:2px solid var(--accent); padding-left:10px; border-radius:0; margin:0 0 .8rem; }
.chart-card { background:var(--sheet); border:.5px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:1.4rem; }
.chart-title { font-size:.72rem; color:var(--ink-muted); margin-bottom:6px; }
.legend { display:flex; gap:14px; font-size:.66rem; color:var(--ink-muted); margin-bottom:4px; }
.legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
svg { width:100%; height:auto; display:block; }
.chart-box { position:relative; }
.ctip { position:absolute; display:none; background:var(--ink); color:#fff; font-size:.66rem; padding:4px 8px; border-radius:3px; pointer-events:none; z-index:20; white-space:nowrap; line-height:1.5; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="back" href="dept-3.html">← 返回部门</a>
    <span class="p-title">赵伟伟</span>
    <span class="p-dept">事业三部</span>
    <span id="themeToggle" style="cursor:pointer;font-size:.78rem;margin-left:auto" title="切换浅色/深色主题">◐</span>
  </div>
  <hr class="rule">
  <div class="kpi">
    <div class="k"><div class="kl">好友总量</div><div class="kv">76</div></div>
    <div class="k"><div class="kl">进度状态</div><div class="kv" style="font-size:.9rem;padding-top:4px"><span class="badge badge-danger">严重偏低</span></div></div>
    <div class="k"><div class="kl">本月目标</div><div class="kv">200</div></div>
    <div class="k"><div class="kl">今日通话</div><div class="kv">0 通</div></div>
    <div class="k"><div class="kl">今日加友</div><div class="kv">+0</div></div>
    <div class="k"><div class="kl">当月二筛</div><div class="kv">48</div></div>
  </div>
  <div class="sec-title">好友总量 · 全量趋势</div>
  <div class="chart-card">
    <div class="legend"><span><span class="dot" style="background:var(--accent)"></span>好友总量</span><span><span class="dot" style="background:var(--ochre)"></span>目标基准线</span></div>
    <div class="chart-box"><div id="chartFriends"></div><div class="ctip" id="tipFriends"></div></div>
  </div>
  <div class="sec-title">每日通话量 · 全量</div>
  <div class="chart-card">
    <div class="legend"><span><span class="dot" style="background:var(--accent)"></span>通话数</span></div>
    <div class="chart-box"><div id="chartCalls"></div><div class="ctip" id="tipCalls"></div></div>
  </div>
  <div class="sec-title">产能 · 提交二筛与路演</div>
  <div class="chart-card">
    <div class="legend"><span><span class="dot" style="background:var(--accent)"></span>提交二筛（折线）</span><span><span class="dot" style="background:var(--ochre)"></span>路演数（柱）</span></div>
    <div class="chart-box"><div id="chartCap"></div><div class="ctip" id="tipCap"></div></div>
  </div>
</div>
<script>
var P = {"name": "赵伟伟", "dept": "事业三部", "deptLink": "dept-3.html", "dates": ["2026-07-31", "2026-08-03", "2026-08-04", "2026-08-05", "2026-08-06", "2026-08-07", "2026-08-09", "2026-08-10", "2026-08-11", "2026-08-12", "2026-08-13", "2026-08-14", "2026-08-15", "2026-08-16", "2026-08-17", "2026-08-18", "2026-08-19", "2026-08-20", "2026-08-21", "2026-08-22", "2026-08-23", "2026-08-24"], "friends": [31, 31, 31, 32, 33, 36, 36, 41, 49, 52, 59, 62, 62, 62, 65, 67, 69, 75, 76, 76, 76, 76], "baseline": [200.0, 19.4, 25.8, 32.3, 38.7, 45.2, 58.1, 64.5, 71.0, 77.4, 83.9, 90.3, 96.8, 103.2, 109.7, 116.1, 122.6, 129.0, 135.5, 141.9, 148.4, 154.8], "calls": [53, 24, 36, 51, 67, 57, 0, 47, 70, 22, 44, 23, 0, 0, 17, 46, 37, 71, 14, 1, 0, 0], "newFriends": [0, 0, 0, 1, 0, 3, 0, 5, 8, 3, 7, 3, 0, 0, 3, 2, 2, 6, 1, 0, 0, 0], "status": "严重偏低", "goal": 200, "totalFriends": 76, "monthErshai": [["2026/05", 0], ["2026/06", 50], ["2026/07", 60]], "monthRoadshow": [["2026/05", 0], ["2026/06", 0], ["2026/07", 4]], "curErshai": 48};
var W = 0;
function drawLine(containerId, values, baseline, opts){
  var el = document.getElementById(containerId);
  W = el.clientWidth || 720;
  var H = 200, padL = 36, padR = 12, padT = 14, padB = 26;
  var n = values.length;
  var maxV = Math.max.apply(null, values.concat(baseline||[]));
  maxV = Math.max(maxV, 1);
  var minV = opts && opts.min != null ? opts.min : Math.min.apply(null, values.concat(baseline||[]));
  minV = Math.min(minV, 0);
  var range = (maxV - minV) || 1;
  var iw = W - padL - padR, ih = H - padT - padB;
  var x = function(i){ return padL + (n===1 ? iw/2 : iw * i / (n-1)); };
  var y = function(v){ return padT + ih * (1 - (v - minV) / range); };
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  // 网格
  for(var g=0; g<=4; g++){
    var gy = padT + ih*g/4;
    var gv = maxV - range*g/4;
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--border)" stroke-width=".5"/>';
    svg += '<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="9" fill="var(--ink-muted)">'+Math.round(gv)+'</text>';
  }
  // x 轴刻度（自适应密度）
  var step = Math.ceil(n / Math.max(4, Math.floor(iw/70)));
  for(var i=0; i<n; i+=step){
    var lx = x(i);
    svg += '<text x="'+lx+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--ink-muted)">'+P.dates[i].slice(5)+'</text>';
  }
  // 基准线（虚线）
  if(baseline){
    var bp = '';
    for(var b=0; b<baseline.length; b++) bp += (b?' L':'M')+x(b).toFixed(1)+' '+y(baseline[b]).toFixed(1);
    svg += '<path d="'+bp+'" fill="none" stroke="var(--ochre)" stroke-width="1" stroke-dasharray="5,4"/>';
  }
  // 数据线
  var lp = '';
  for(var i=0; i<n; i++) lp += (i?' L':'M')+x(i).toFixed(1)+' '+y(values[i]).toFixed(1);
  svg += '<path d="'+lp+'" fill="none" stroke="var(--accent)" stroke-width="1.6"/>';
  // 数据点 + 透明感应区（data-tip/data-idx，事件委托）
  var showDot = n <= 40;
  var tipId = containerId === 'chartFriends' ? 'tipFriends' : 'tipCalls';
  for(var i=0; i<n; i++){
    svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(values[i]).toFixed(1)+'" r="'+(showDot?2.2:1.2)+'" fill="var(--accent)"/>';
    svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(values[i]).toFixed(1)+'" r="9" fill="transparent" class="tipdot" data-tip="'+tipId+'" data-idx="'+i+'"/>';
  }
  svg += '</svg>';
  el.innerHTML = svg;
  el.dataset.series = JSON.stringify({label:P.dates, val:values, base:baseline||[]});
  el.onmousemove = function(ev){
    var t = ev.target;
    if(!t.classList || !t.classList.contains('tipdot')) return;
    var S = JSON.parse(this.dataset.series);
    var i = +t.dataset.idx;
    var txt = S.label[i]+'：'+S.val[i]+(S.base.length?(' / 基准 '+S.base[i]):'');
    showTip(t.dataset.tip, txt, ev, this);
  };
  el.onmouseleave = function(){ hideTips(); };
}

// 悬浮提示
function showTip(id, txt, ev, boxEl){
  var el = document.getElementById(id); if(!el) return;
  el.innerHTML = txt; el.style.display = 'block';
  var box = boxEl.getBoundingClientRect();
  var x = ev.clientX - box.left + 14, y = ev.clientY - box.top - 10;
  if(x + 130 > box.width) x = ev.clientX - box.left - 130;
  el.style.left = x+'px'; el.style.top = y+'px';
}
function hideTips(){ var els = document.querySelectorAll('.ctip'); for(var i=0;i<els.length;i++) els[i].style.display='none'; }
function drawCap(){
  var labels = P.monthErshai.map(function(m){ return parseInt(m[0].split('/')[1])+'月'; });
  var ershai = P.monthErshai.map(function(m){ return m[1]; });
  var roadshow = P.monthRoadshow.map(function(m){ return m[1]; });
  // 当月二筛追加到折线（当前月 + 1）
  if (P.curErshai !== undefined && P.curErshai !== null) {
    var now = new Date();
    var curLabel = (now.getMonth()+1)+'月';
    var lastLabel = labels.length ? labels[labels.length-1] : '';
    if (!lastLabel || (lastLabel !== curLabel)) {
      labels.push(curLabel); ershai.push(P.curErshai); roadshow.push(null);
    }
  }
  if (!labels.length) { document.getElementById('chartCap').innerHTML = '<div style="color:var(--ink-muted);font-size:.75rem">暂无产能数据</div>'; return; }
  var el = document.getElementById('chartCap');
  var W = el.clientWidth || 720, H = 200, padL = 36, padR = 12, padT = 14, padB = 26;
  var n = labels.length;
  var maxV = 1;
  ershai.forEach(function(v){ if(v>maxV) maxV=v; });
  roadshow.forEach(function(v){ if(v!=null && v>maxV) maxV=v; });
  var minV = 0, range = maxV - minV || 1;
  var iw = W - padL - padR, ih = H - padT - padB;
  var x = function(i){ return padL + (n===1 ? iw/2 : iw*i/(n-1)); };
  var y = function(v){ return padT + ih * (1 - (v - minV) / range); };
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(var g=0; g<=4; g++){
    var gy = padT + ih*g/4, gv = maxV - range*g/4;
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--border)" stroke-width=".5"/>';
    svg += '<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="9" fill="var(--ink-muted)">'+Math.round(gv)+'</text>';
  }
  var bw = Math.min(22, iw/n*0.4);
  for(var i=0; i<n; i++){
    svg += '<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--ink-muted)">'+labels[i]+'</text>';
    if (roadshow[i] != null) {
      var bh = (roadshow[i]/maxV)*ih;
      svg += '<rect x="'+(x(i)-bw/2)+'" y="'+(padT+ih-bh)+'" width="'+bw+'" height="'+bh+'" fill="rgba(157,95,77,.45)" rx="1"/>';
      svg += '<rect x="'+(x(i)-bw/2)+'" y="'+(padT+ih-bh)+'" width="'+bw+'" height="'+bh+'" fill="transparent" class="tipdot" data-tip="tipCap" data-kind="r" data-idx="'+i+'"/>';
    }
  }
  var lp = '';
  for(var i=0; i<n; i++) lp += (i?' L':'M')+x(i).toFixed(1)+' '+y(ershai[i]).toFixed(1);
  svg += '<path d="'+lp+'" fill="none" stroke="var(--accent)" stroke-width="1.6"/>';
  var showDot = n <= 40;
  for(var i=0; i<n; i++){
    svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(ershai[i]).toFixed(1)+'" r="'+(showDot?2.2:1.2)+'" fill="var(--accent)"/>';
    svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(ershai[i]).toFixed(1)+'" r="9" fill="transparent" class="tipdot" data-tip="tipCap" data-kind="e" data-idx="'+i+'"/>';
  }
  svg += '</svg>';
  el.innerHTML = svg;
  el.dataset.cap = JSON.stringify({labels:labels, ershai:ershai, roadshow:roadshow});
  el.onmousemove = function(ev){
    var t = ev.target;
    if(!t.classList || !t.classList.contains('tipdot')) return;
    var C = JSON.parse(this.dataset.cap);
    var i = +t.dataset.idx;
    var txt = t.dataset.kind==='r' ? (C.labels[i]+' 路演 '+C.roadshow[i]) : (C.labels[i]+' 二筛 '+C.ershai[i]);
    showTip(t.dataset.tip, txt, ev, this);
  };
  el.onmouseleave = function(){ hideTips(); };
}
function draw(){
  drawLine('chartFriends', P.friends, P.baseline, null);
  drawLine('chartCalls', P.calls, null, {min:0});
  drawCap();
}
window.addEventListener('resize', draw);
draw();

// 主题切换（浅色 → 深色 → 绿色 循环，与首页共用 storage）
(function(){
  var btn = document.getElementById('themeToggle');
  var saved = localStorage.getItem('daily-report-theme') || 'light';
  function apply(t){
    document.documentElement.classList.remove('theme-dark','theme-green');
    if(t==='dark') document.documentElement.classList.add('theme-dark');
    if(t==='green') document.documentElement.classList.add('theme-green');
    btn.textContent = t==='light' ? '◐' : (t==='dark' ? '◑' : '◈');
    localStorage.setItem('daily-report-theme', t);
  }
  apply(saved);
  btn.onclick = function(){
    var cur = localStorage.getItem('daily-report-theme') || 'light';
    var next = cur==='light' ? 'dark' : (cur==='dark' ? 'green' : 'light');
    apply(next);
  };
})();
</script>
</body>
</html>
