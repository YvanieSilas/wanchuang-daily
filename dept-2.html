<style>
:root {
  --paper: #F5EFE4; --sheet: #FBF7EE; --sand: #E8E6DC;
  --ink: #2A2622; --ink-light: #4A433C; --ink-muted: #6B6158; --ink-faint: #C9C1B2;
  --border: #D8CFBE; --accent: #537D96; --accent-deep: #1B365D; --accent-light: rgba(83,125,150,.08);
  --green: #4A6B4A; --danger: #8B2C1F; --ochre: #9D5F4D; --warm-gray: #8F867B;
  --radius: 3px;
  --font-serif: 'Georgia','Noto Serif SC','Songti SC',serif;
}
:root.theme-dark {
  --paper: #0f1419; --sheet: #161b22; --sand: #1c2128;
  --ink: #c9d1d9; --ink-light: #8b949e; --ink-muted: #6e7681; --ink-faint: #484f58;
  --border: #30363d; --accent: #58a6ff; --accent-deep: #79c0ff; --accent-light: rgba(88,166,255,.1);
  --green: #3fb950; --danger: #f85149; --ochre: #d29922; --warm-gray: #6e7681;
}
:root.theme-green {
  --paper: #F5F1E8; --sheet: #FBF9F2; --sand: #EAE5D9;
  --ink: #2A2A24; --ink-light: #4A4A42; --ink-muted: #6E6E64; --ink-faint: #C6C4B8;
  --border: #DAD5C8; --accent: #4F7A4F; --accent-deep: #345534; --accent-light: rgba(79,122,79,.1);
  --green: #4F7A4F; --danger: #8B2C1F; --ochre: #9D6B4D; --warm-gray: #8A8578;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--paper); color:var(--ink); font-family:-apple-system,'PingFang SC',sans-serif; }
.page { max-width:960px; margin:0 auto; padding:1.6rem 1.2rem 3rem; }
a { color:var(--accent); text-decoration:none; }
a:hover { color:var(--accent-deep); }
.topbar { display:flex; align-items:baseline; gap:10px; margin-bottom:.6rem; flex-wrap:wrap; }
.back { font-size:.8rem; }
.dept-title { font-family:var(--font-serif); font-size:1.5rem; font-weight:500; letter-spacing:.05em; }
.dateline { font-size:.75rem; color:var(--ink-muted); }
.rule { border:none; border-top:.5px solid var(--border); margin:.7rem 0 1.2rem; }
.month-strip { display:flex; align-items:center; gap:3px; margin-bottom:1.4rem; }
.ms-arrow { color:var(--ink-muted); cursor:pointer; font-size:.9rem; padding:0 6px; user-select:none; }
.ms-label { font-family:var(--font-serif); font-size:.75rem; color:var(--ink-muted); margin-right:6px; }
.ms-day { width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:.7rem; border-radius:3px; color:var(--ink-faint); }
.ms-day.has { color:var(--accent); border:.5px solid var(--border); cursor:pointer; }
.ms-day.sel { background:var(--accent); color:var(--sheet); font-weight:500; border-color:var(--accent); }
.ov-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:1.5rem; }
.ov-cell { background:var(--sheet); border:.5px solid var(--border); border-radius:var(--radius); padding:.8rem .6rem; text-align:center; }
.ov-cell .ol { font-size:.62rem; color:var(--ink-muted); letter-spacing:.03em; }
.ov-cell .ov { font-family:var(--font-serif); font-size:1.25rem; font-weight:500; color:var(--accent-deep); }
.ov-cell .ov.danger { color:var(--danger); }
.sec-title { font-family:var(--font-serif); font-size:.92rem; font-weight:500; border-left:2px solid var(--accent); padding-left:10px; border-radius:0; margin-bottom:.8rem; }
.m-table { border:.5px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:1.6rem; }
.m-hdr { display:grid; grid-template-columns:1.3fr .5fr .5fr .6fr .6fr .6fr .8fr .7fr; gap:0; background:var(--sand); padding:6px 12px; font-size:.64rem; color:var(--ink-muted); }
.m-row { display:grid; grid-template-columns:1.3fr .5fr .5fr .6fr .6fr .6fr .8fr .7fr; gap:0; padding:8px 12px; font-size:.78rem; border-top:.5px solid var(--border); cursor:pointer; background:var(--sheet); }
.m-row:hover { background:var(--accent-light); }
.m-row .nm { font-weight:500; }
.plink { font-size:.6rem; color:var(--accent); text-decoration:none; border:.5px solid var(--border); border-radius:9px; padding:0 6px; margin-left:5px; opacity:.75; }
.plink:hover { opacity:1; }
.badge { display:inline-block; padding:1px 8px; border-radius:9px; font-size:.66rem; }
.badge-great { background:rgba(83,125,150,.12); color:var(--accent); }
.badge-ok { background:rgba(74,107,74,.12); color:var(--green); }
.badge-warn { background:rgba(157,95,77,.12); color:var(--ochre); }
.badge-danger { background:rgba(139,44,31,.12); color:var(--danger); }
.m-detail { display:none; padding:10px 12px 12px 26px; border-top:.5px solid var(--border); background:var(--paper); font-size:.74rem; }
.m-detail.open { display:block; }
.m-detail .dl { font-size:.64rem; color:var(--ink-muted); margin-bottom:4px; }
.pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.68rem; margin:2px 4px 2px 0; background:var(--accent-light); color:var(--accent); }
.pill.none { background:rgba(143,134,123,.12); color:var(--warm-gray); }
.proj-card { background:var(--sheet); border:.5px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:8px; }
.proj-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; flex-wrap:wrap; gap:4px; }
.proj-name { font-weight:500; font-size:.82rem; }
.proj-meta { font-size:.66rem; color:var(--ink-muted); }
.proj-summary { font-size:.72rem; color:var(--ink-light); line-height:1.6; }
.trend { display:flex; align-items:flex-end; gap:8px; height:80px; padding:12px 14px; border:.5px solid var(--border); border-radius:var(--radius); background:var(--sheet); }
.trend .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; position:relative; }
.trend .bar .fill { width:72%; background:var(--accent); border-radius:1px 1px 0 0; opacity:.9; }
.trend .bar .lbl { font-size:.58rem; color:var(--ink-muted); margin-top:3px; }
.trend .bar .bt-tip { display:none; position:absolute; bottom:105%; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:.62rem; padding:3px 7px; border-radius:3px; white-space:nowrap; z-index:10; pointer-events:none; }
.trend .bar:hover .bt-tip { display:block; }
@media(max-width:700px){
  .ov-grid { grid-template-columns:repeat(3,1fr); }
  .m-hdr,.m-row { grid-template-columns:1.2fr .5fr .5fr .7fr .7fr; }
  .m-hdr span:nth-child(n+6),.m-row span:nth-child(n+6) { display:none; }
}
</style>

  document.getElementById('mRows').innerHTML = rows;

  document.querySelectorAll('.m-row').forEach(function(el){
    el.onclick = function(){
      var det = document.getElementById('det-'+el.dataset.name);
      if(det) det.classList.toggle('open');
    };
  });

  var ph = '';
  d.projects.forEach(function(pr){
    ph += '<div class="proj-card"><div class="proj-head">'+
      '<span class="proj-name">'+esc(pr.name)+'</span>'+
      '<span class="proj-meta">推送 '+pr.pushCount+' · 高意向 '+pr.highCount+' · 无意向 '+(pr.noneCount||0)+' · 未明确 '+(pr.unclearCount||0)+'</span></div>'+
      '<div class="proj-summary">'+esc(pr.summary||'')+'</div></div>';
  });
  document.getElementById('projBox').innerHTML = ph || '<div style="color:var(--ink-muted);font-size:.78rem">今日暂无项目推送</div>';

  // 近 7 天趋势
  var trend = '';
  for(var i=6;i>=0;i--){
    var k = DATES[Math.min(Math.max(DATES.indexOf(dateKey)-i,0), DATES.length-1)];
    var dd = DATA[k];
    var v = dd? dd.totalCallCount : 0;
    var isSel = k===dateKey;
    trend += '<div class="bar"><div class="bt-tip">'+(k||'')+'：'+v+' 通</div><div class="fill" style="height:'+Math.max(4,Math.min(100,v/3))+'%'+(isSel?'':' ;opacity:.35')+'"></div><span class="lbl">'+(k?k.slice(5):'')+'</span></div>';
  }
  document.getElementById('trendBox').innerHTML = trend;

  renderMonthStrip(dateKey);
}

var stripY = null, stripM = null;
function renderMonthStrip(dateKey){
  var p = dateKey.split('-'); stripY = +p[0]; stripM = +p[1];
  var dim = new Date(stripY, stripM, 0).getDate();
  var html = '<span class="ms-arrow" onclick="shiftStrip(-1)">‹</span><span class="ms-label">'+stripM+'月</span>';
  for(var d=1; d<=dim; d++){
    var k = stripY+'-'+String(stripM).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var has = DATA[k] !== undefined;
    var cls = 'ms-day'+(has?' has':'')+(k===dateKey?' sel':'');
    html += '<span class="'+cls+'"'+(has?' onclick="jump(\''+k+'\')"':'')+'>'+d+'</span>';
  }
  html += '<span class="ms-arrow" onclick="shiftStrip(1)">›</span>';
  document.getElementById('monthStrip').innerHTML = html;
}
function shiftStrip(dir){
  stripM += dir;
  if(stripM<1){ stripM=12; stripY--; }
  if(stripM>12){ stripM=1; stripY++; }
  var target = null;
  for(var d=1; d<=31; d++){
    var k = stripY+'-'+String(stripM).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(DATA[k]!==undefined){ target=k; break; }
  }
  if(target) jump(target);
}
function jump(k){ if(DATA[k]){ cur = DATES.indexOf(k); render(k); } }

document.onkeydown = function(e){
  if(e.key==='ArrowLeft'&&cur>0){cur--;render(DATES[cur]);}
  if(e.key==='ArrowRight'&&cur<DATES.length-1){cur++;render(DATES[cur]);}
};

render(DATES[cur]);

// 主题切换（浅色 → 深色 → 绿色 循环，与首页共用 storage）
(function(){
  var btn = document.getElementById('themeToggle');
  var saved = localStorage.getItem('daily-report-theme') || 'light';
  function apply(t){
    document.documentElement.classList.remove('theme-dark','theme-green');
    if(t==='dark') document.documentElement.classList.add('theme-dark');
    if(t==='green') document.documentElement.classList.add('theme-green');
    btn.textContent = t==='light' ? '◐' : (t==='dark' ? '◑' : '◈');
    localStorage.setItem('daily-report-theme', t);
  }
  apply(saved);
  btn.onclick = function(){
    var cur = localStorage.getItem('daily-report-theme') || 'light';
    var next = cur==='light' ? 'dark' : (cur==='dark' ? 'green' : 'light');
    apply(next);
  };
})();
</script>
